<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's the Highest?</title>
  <meta name="description" content="The people's chart of elevated states. Submit your own “Too high to…” and vote. Ranked by highness.">
  <meta name="theme-color" content="#DDF3E6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239BB86A'/%3E%3Crect x='12' y='38' width='40' height='9' rx='4.5' fill='%23F3EEE3' stroke='%236A5E52' stroke-width='2'/%3E%3Cpath d='M15 39 A17 17 0 0 1 49 39 Z' fill='%239FC3D6' stroke='%236A5E52' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Exo+2:ital,wght@0,400..700;1,400..700&display=swap">
  <link rel="stylesheet" href="styles.css?v=18">
  <script type="module" src="app.js?v=18"></script>
</head>
<body>
  <svg class="art" id="art" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <script src="art.js?v=18"></script>

  <main class="wrap">
    <header class="title">
      <h1>What's the Highest?</h1>
    </header>

    <p class="demo-note" id="demo-note" hidden>Demo mode: not connected to a database yet. Votes and posts are saved in this browser only.</p>

    <section class="chart" aria-label="The Highness Chart">
      <div class="axis" aria-hidden="true">
        <span class="axis-title">Highness</span>
        <div class="axis-line"></div>
      </div>
      <ol class="rungs" id="top" aria-label="Top 10, highest first">
        <li class="loading">Receiving transmissions…</li>
      </ol>
    </section>

    <h2 id="submit-h">File your own report</h2>
    <form id="submit-form" class="submit" autocomplete="off" aria-labelledby="submit-h">
      <label for="entry">Too high to</label>
      <input id="entry" name="entry" type="text" minlength="3" maxlength="80" required placeholder="parallel park" spellcheck="true">
      <button type="submit">Launch</button>
    </form>
    <p class="hint"><span id="count">0</span>/80 · Vote ▲ if it's a higher state, ▼ if it's not that high. One vote per post per browser.</p>

    <h2 id="fresh-h">New Arrivals</h2>
    <ol class="rungs fresh" id="fresh" aria-labelledby="fresh-h"></ol>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
